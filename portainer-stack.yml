services:
  wealthfolio-importer:
    image: ghcr.io/gummiees/wealthfolio-importer:latest
    container_name: wealthfolio-importer
    restart: unless-stopped

    environment:
      DRY_RUN: "false"
      SEED_STATE_ONLY: "false"
      AUTO_IMPORT: "true"
      WEALTHFOLIO_MCP_URL: "http://wealthfolio:8088/mcp"
      WEALTHFOLIO_MCP_TOKEN_FILE: "/run/secrets/wealthfolio_mcp_token"
      MCP_IMPORT_BATCH_SIZE: "500"
      POLL_INTERVAL_SECONDS: "30"

    volumes:
      - /volume1/finance/wealthfolio-importer/config/config.json:/app/config.json:ro
      - /volume1/finance/wealthfolio-importer/data/inbox:/inbox
      - /volume1/finance/wealthfolio-importer/data/outbox:/outbox
      - /volume1/finance/wealthfolio-importer/data/processed:/processed
      - /volume1/finance/wealthfolio-importer/data/failed:/failed
      - /volume1/finance/wealthfolio-importer/data/state:/state
      - /volume1/finance/wealthfolio-importer/secrets/wealthfolio_mcp_token:/run/secrets/wealthfolio_mcp_token:ro

    networks:
      - traefik_proxy

  wealthfolio-importer-web:
    image: ghcr.io/gummiees/wealthfolio-importer:latest
    container_name: wealthfolio-importer-web
    restart: unless-stopped
    command: ["uvicorn", "wealthfolio_importer.web.app:app", "--host", "0.0.0.0", "--port", "8000"]

    environment:
      CONFIG_PATH: "/app/config.json"
      INBOX_DIR: "/inbox"

    volumes:
      - /volume1/finance/wealthfolio-importer/config/config.json:/app/config.json:ro
      - /volume1/finance/wealthfolio-importer/data/inbox:/inbox

    networks:
      - traefik_proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.wealthfolio-importer.rule=Host(`importer.gummiees.party`)"
      - "traefik.http.routers.wealthfolio-importer.entrypoints=websecure"
      - "traefik.http.routers.wealthfolio-importer.tls=true"
      - "traefik.http.routers.wealthfolio-importer.tls.certresolver=cloudflare"
      - "traefik.http.routers.wealthfolio-importer.service=wealthfolio-importer-web"
      - "traefik.http.services.wealthfolio-importer-web.loadbalancer.server.port=8000"

networks:
  traefik_proxy:
    external: true
