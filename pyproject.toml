[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthfolio-importer"
version = "0.4.0"
description = "Convert broker exports into Wealthfolio activity CSV files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.8",
    "jinja2==3.1.6",
    "mcp==1.30.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.31",
    "uvicorn[standard]==0.39.0",
]

[project.scripts]
wealthfolio-importer = "wealthfolio_importer.cli:main"

[tool.setuptools.packages.find]
include = ["wealthfolio_importer*"]
