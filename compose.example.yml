services:
  wealthfolio-importer:
    image: ghcr.io/gummiees/wealthfolio-importer:latest
    container_name: wealthfolio-importer
    restart: unless-stopped

    environment:
      DRY_RUN: "true"
      SEED_STATE_ONLY: "false"
      POLL_INTERVAL_SECONDS: "30"
      CONFIG_PATH: "/app/config.json"
      INBOX_DIR: "/inbox"
      OUTBOX_DIR: "/outbox"
      PROCESSED_DIR: "/processed"
      FAILED_DIR: "/failed"
      STATE_DIR: "/state"

    volumes:
      - ./config/config.json:/app/config.json:ro
      - ./data/inbox:/inbox
      - ./data/outbox:/outbox
      - ./data/processed:/processed
      - ./data/failed:/failed
      - ./data/state:/state

  wealthfolio-importer-web:
    build: .
    container_name: wealthfolio-importer-web
    restart: unless-stopped
    command: ["uvicorn", "wealthfolio_importer.web.app:app", "--host", "0.0.0.0", "--port", "8000"]

    environment:
      CONFIG_PATH: "/app/config.json"
      INBOX_DIR: "/inbox"

    volumes:
      - ./config/config.json:/app/config.json:ro
      - ./data/inbox:/inbox

    ports:
      - "8000:8000"
